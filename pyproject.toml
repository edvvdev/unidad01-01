[project]
name = "inf8239-u01"
version = "0.1.0"
description = "Ejercicios 01 y 02 de INF-8239 Ciencia de Datos II (Unidad 01): SVM reproducible, dataset público, ensambles y Green AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    # El manual de la Unidad 01 (LAB01 §7-§8) construye el SVM con `probability=True` para
    # el ROC-AUC; ese parámetro está obsoleto desde scikit-learn 1.9 y se elimina en 1.11,
    # así que se acota la versión para que el código del manual siga funcionando.
    "scikit-learn>=1.4,<1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_u01"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# En los notebooks el `sys.path.insert` precede a los imports del paquete: es intencional.
"notebooks/*.ipynb" = ["E402"]
